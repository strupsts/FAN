services:
  db:
    image: postgres:16
    container_name: fan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fan
      POSTGRES_USER: fan
      POSTGRES_PASSWORD: fan_dev_password
    ports:
      - "5432:5432"
    volumes:
      - fan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fan -d fan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fan_postgres_data:
